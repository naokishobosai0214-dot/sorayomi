# 気象庁に新しい地上天気図(FSAS24・48 の初期値がそろった回)が出たら、ページを作り直して Cloudflare Pages(https://narabete-tenkizu.pages.dev/)に公開する。
# 15分ごとに調べ、変わっていなければ数秒で終わる。手動実行で「force」を付けると必ず作り直す。
name: update

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "変わっていなくても作り直す"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 385e8c929e084a811dcd4a0999cf0b2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 新しい図が出たか調べる
        id: check
        env:
          FORCE: ${{ inputs.force }}
        run: python build_site.py --check
      - name: ライブラリを入れる
        if: steps.check.outputs.changed == 'true'
        run: pip install -r requirements.txt
      - name: ページを作る
        if: steps.check.outputs.changed == 'true'
        run: python build_site.py
      # GitHub Pages(github.io)は 2026-10-14 にやめた。公開先は Cloudflare Pages だけ
      - name: Cloudflare Pages に公開する
        if: steps.check.outputs.changed == 'true'
        run: |
          npx --yes wrangler@4.20.0 pages project create narabete-tenkizu --production-branch=main || true
          npx --yes wrangler@4.20.0 pages deploy site --project-name=narabete-tenkizu --branch=main --commit-dirty=true
      # 新しい図を公開したら、すぐ X に投稿する(x_bot.yml。投稿済み・予定外の日は何もしない)
      - name: X に投稿する
        if: steps.check.outputs.changed == 'true' && inputs.force != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run x_bot.yml -R "${{ github.repository }}" -f mode=post
      # 60日間リポジトリに変更がないと、時刻指定の実行が止まるため、この設定を有効にし直しておく
      - name: 自動実行を止めないようにする
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable"
